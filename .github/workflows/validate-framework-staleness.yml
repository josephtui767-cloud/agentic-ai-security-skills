name: Framework Registry Staleness

on:
  schedule:
    - cron: "0 7 * * 1"   # Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  staleness:
    name: Check framework date_reviewed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
      - name: Run staleness check
        run: |
          # Warnings only — errors would need a hard refresh of the
          # frameworks.yaml date_reviewed fields.
          ruby scripts/validate_framework_registry.rb --stale --max-age-days 365 | tee staleness.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: framework-staleness-report
          path: staleness.txt
