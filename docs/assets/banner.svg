<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Decorative nodes on the right -->
  <g opacity="0.55" transform="translate(880, 160)">
    <!-- Central node (agent) -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#38BDF8"/>
    <text x="0" y="60" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">agent</text>

    <!-- Surrounding tool / memory / inter-agent nodes -->
    <g>
      <line x1="38" y1="0" x2="130" y2="-70" stroke="#38BDF8" stroke-width="1.2" opacity="0.6"/>
      <circle cx="140" cy="-75" r="22" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="140" y="-71" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">tool</text>

      <line x1="38" y1="0" x2="150" y2="0" stroke="#818CF8" stroke-width="1.2" opacity="0.6"/>
      <circle cx="160" cy="0" r="22" fill="none" stroke="#818CF8" stroke-width="1.5"/>
      <text x="160" y="4" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">mem</text>

      <line x1="38" y1="0" x2="130" y2="70" stroke="#C084FC" stroke-width="1.2" opacity="0.6"/>
      <circle cx="140" cy="75" r="22" fill="none" stroke="#C084FC" stroke-width="1.5"/>
      <text x="140" y="79" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">agent</text>

      <line x1="-38" y1="0" x2="-130" y2="-70" stroke="#38BDF8" stroke-width="1.2" opacity="0.6"/>
      <circle cx="-140" cy="-75" r="22" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="-140" y="-71" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">user</text>

      <line x1="-38" y1="0" x2="-130" y2="70" stroke="#818CF8" stroke-width="1.2" opacity="0.6"/>
      <circle cx="-140" cy="75" r="22" fill="none" stroke="#818CF8" stroke-width="1.5"/>
      <text x="-140" y="79" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" text-anchor="middle">rag</text>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
      Agentic AI Security Skills
    </text>
    <text x="0" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400">
      Framework-grounded security playbooks for AI coding agents and agentic AI systems.
    </text>
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="90" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="45" y="17" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">60 skills</text>

      <rect x="100" y="0" width="110" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="155" y="17" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">15 domains</text>

      <rect x="220" y="0" width="120" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="280" y="17" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">5 role bundles</text>

      <rect x="350" y="0" width="150" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="425" y="17" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">OWASP · NIST · ATLAS</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
</svg>
